# Keep E2E consumer fixtures outside the workspace.
packages:
  - .

# Native dependencies with install scripts in the imported npm lockfile.
allowBuilds:
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  fsevents: true

# Already pinned and verified by the existing Eve compatibility matrix.
#
# pnpm applies only the FIRST entry whose name matches a package, so a package
# needed at two versions takes one entry with a version union (`a || b`): a
# second `@workflow/world@...` line would be silently ignored.
minimumReleaseAgeExclude:
  - eve@0.83.3
  # Two @workflow/* sets meet in this tree. The first of each union is the set
  # eve 0.75.1 introduced and every release through 0.81.1 still bundles
  # (src/eve-pin-contract.test.ts pins this package to it). The second is what
  # the conformance harness, @workflow/world-testing 5.0.6, pins for its own
  # runtime bundle; the harness is exempt from eve's pins and moved off beta.55
  # once this World declared spec 8, which every harness from beta.56 on
  # demands (conformance/spec.test.mts asserts the two agree).
  - "@workflow/core@5.2.0 || 5.2.3"
  - "@workflow/errors@5.0.3 || 5.0.5"
  - "@workflow/world@5.0.3 || 5.0.5"
  - "@workflow/world-local@5.1.0 || 5.1.2"
  - "@workflow/world-vercel@5.2.0 || 5.2.3"
  - "@workflow/astro@5.0.6"
  - "@workflow/builders@5.0.6"
  - "@workflow/cli@5.0.6"
  - "@workflow/nest@5.1.4"
  - "@workflow/next@5.0.6"
  - "@workflow/nitro@5.0.6"
  - "@workflow/nuxt@5.0.6"
  - "@workflow/rollup@5.0.6"
  - "@workflow/sveltekit@5.0.6"
  - "@workflow/vite@5.0.6"
  - "@workflow/web@5.0.6"
  - "@workflow/world-testing@5.0.6"
  - workflow@5.2.3
