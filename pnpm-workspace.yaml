# Keep E2E consumer fixtures outside the workspace.
packages:
  - .

# Native dependencies with install scripts in the imported npm lockfile.
allowBuilds:
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  fsevents: true

# eve 1.0.0 is younger than pnpm's default minimum release age. The
# `@workflow/*` set it bundles (src/eve-pin-contract.test.ts) is older and
# needs no exception. pnpm applies only the FIRST entry whose name matches a
# package, so a package needed at two versions takes one `a || b` entry.
minimumReleaseAgeExclude:
  - eve@1.0.0
