# Keep E2E consumer fixtures outside the workspace.
packages:
  - .

# Native dependencies with install scripts in the imported npm lockfile.
allowBuilds:
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  fsevents: true

# Already pinned and verified by the existing Eve compatibility matrix.
minimumReleaseAgeExclude:
  - eve@0.58.0
  # The conformance harness and the @workflow/* set it pins. The harness is
  # exempt from eve's pins (src/eve-pin-contract.test.ts) and was bumped to the
  # first release whose bundled runtime reads spec 7, which this World now
  # stamps; conformance/spec.test.mts asserts the two agree.
  - "@workflow/astro@5.0.0-beta.51"
  - "@workflow/builders@5.0.0-beta.51"
  - "@workflow/cli@5.0.0-beta.51"
  - "@workflow/core@5.0.0-beta.51"
  - "@workflow/nest@5.0.0-beta.51"
  - "@workflow/next@5.0.0-beta.51"
  - "@workflow/nitro@5.0.0-beta.51"
  - "@workflow/nuxt@5.0.0-beta.51"
  - "@workflow/rollup@5.0.0-beta.51"
  - "@workflow/sveltekit@5.0.0-beta.51"
  - "@workflow/swc-plugin@5.0.0-beta.7"
  - "@workflow/vite@5.0.0-beta.51"
  - "@workflow/web@5.0.0-beta.51"
  - "@workflow/world-local@5.0.0-beta.44"
  - "@workflow/world-testing@5.0.0-beta.51"
  - "@workflow/world-vercel@5.0.0-beta.46"
  - "@workflow/world@5.0.0-beta.35"
  - workflow@5.0.0-beta.51
