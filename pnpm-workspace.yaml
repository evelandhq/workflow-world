# Keep E2E consumer fixtures outside the workspace.
packages:
  - .

# Native dependencies with install scripts in the imported npm lockfile.
allowBuilds:
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  fsevents: true

# Already pinned and verified by the Eve compatibility matrix.
#
# pnpm applies only the FIRST entry whose name matches a package, so a package
# needed at two versions takes one entry with a version union (`a || b`): a
# second `@workflow/world@...` line would be silently ignored.
minimumReleaseAgeExclude:
  - eve@1.0.0-rc.6
  # One @workflow/* set: the Workflow 5.4 runtime eve 1.0.0-rc.6 bundles (core
  # 5.4.0 / world 5.1.0 / world-local 5.2.1 / errors 5.1.0; src/eve-pin-contract
  # .test.ts pins this package to it). The conformance harness,
  # @workflow/world-testing 5.0.8, ships its own runtime bundle on the same set;
  # conformance/spec.test.mts asserts the two agree on spec versions.
  - "@workflow/core@5.4.0"
  - "@workflow/errors@5.1.0"
  - "@workflow/world@5.1.0"
  - "@workflow/world-local@5.2.1"
  - "@workflow/world-vercel@5.4.0"
  - "@workflow/astro@5.0.8"
  - "@workflow/builders@5.0.8"
  - "@workflow/cli@5.0.8"
  - "@workflow/nest@5.1.6"
  - "@workflow/next@5.0.8"
  - "@workflow/nitro@5.0.8"
  - "@workflow/nuxt@5.0.8"
  - "@workflow/rollup@5.0.8"
  - "@workflow/sveltekit@5.0.8"
  - "@workflow/swc-plugin@5.0.1"
  - "@workflow/vite@5.0.8"
  - "@workflow/web@5.0.8"
  - "@workflow/world-testing@5.0.8"
  - workflow@5.4.0
