name: Release

# Two steps, deliberately separated by a human.
#
# release-please watches conventional commits on main and keeps ONE open pull
# request that bumps the version and writes CHANGELOG.md. Nothing is published
# while that PR sits there. Merging it is the decision to release: that merge
# tags the commit, cuts a GitHub release, and only then does `publish` run.
#
# The alternative — publishing on every merge to main — is wrong for a 0.x
# package that has carried no production traffic. Cutting a version should be a
# choice, not a side effect of merging a fix.
#
# `bootstrap-sha` in release-please-config.json is the commit published by hand
# as 0.1.0. That first publish cannot come from here: npm will not let you
# configure a trusted publisher for a package that does not exist yet, so
# something has to create it. Everything after that commit is what release-please
# accumulates into the next release PR.
on:
  push:
    branches: [main]
  # So a release can be re-attempted if the publish job fails after the tag was
  # already cut. release-please is idempotent: it will not re-release a version
  # whose tag already exists.
  workflow_dispatch:

# Least privilege at the top; the publish job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole point: this is what lets npm verify the workflow's identity
      # over OIDC, so there is no long-lived NPM_TOKEN to store, rotate or leak.
      # It also makes npm attach a provenance attestation automatically — this
      # repo and package are both public, which is the condition for that.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag release-please just cut, not whatever main has moved on to.
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1, which is newer than what the
      # Node 24 image happens to bundle. Pinning it here rather than trusting
      # the runner image means a runner update cannot silently break publishing.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      # `prepack` runs the build, so `dist/` is produced from this exact tag.
      # No --provenance flag: trusted publishing attaches it on its own.
      - name: Publish
        run: npm publish

      - name: Summary
        run: |
          {
            echo "### Published \`@evelandhq/workflow-world@${{ needs.release-please.outputs.version }}\`"
            echo
            echo "- tag: \`${{ needs.release-please.outputs.tag }}\`"
            echo "- https://www.npmjs.com/package/@evelandhq/workflow-world"
          } >> "$GITHUB_STEP_SUMMARY"
