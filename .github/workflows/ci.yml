name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Unit and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wfw
          POSTGRES_PASSWORD: wfw
          POSTGRES_DB: wfw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      EVELAND_WORKFLOW_WORLD_TEST_URL: postgres://wfw:wfw@127.0.0.1:5432/wfw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  conformance:
    name: Conformance, external mode (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # Do not fail fast: which variant broke is the whole diagnostic.
      fail-fast: false
      matrix:
        include:
          # The default gate. At these settings no lease renewal ever fires — the
          # longest dispatch is far shorter than the interval — which is why the
          # other three variants exist. See KNOWN-GAPS.md G7.
          - name: default
            renew_interval: ""
            renew_fail: ""
            lease_ttl: ""
          # Forces the renewal path to run for real.
          - name: fast-lease-renewal
            renew_interval: "100"
            renew_fail: ""
            lease_ttl: ""
          # The control API refuses every renewal, with the lease TTL left wide.
          # The dispatcher must ABSORB those refusals: the tolerance is
          # `floor(ttl / interval) - 2` = 1798 consecutive misses here, and no
          # dispatch gets past 6, so every held POST must still run to
          # completion. This is the regression guard on the original fix —
          # aborting on the first failed renewal turned one 503 from the control
          # API into a burned graphile attempt, and three of those dead-letter
          # the run.
          - name: lease-renewal-refused
            renew_interval: "100"
            renew_fail: "1"
            lease_ttl: ""
          # Same refusal, but a TTL narrow enough that the refusals outrun it:
          # tolerance drops to 1, so the second consecutive miss must ABORT the
          # held POST rather than let a step keep running on a lease the platform
          # no longer honours. graphile then has to retry the aborted job to
          # completion. The pair is the point — the variant above proves a blip
          # is survived, this one proves sustained failure is not ignored.
          - name: lease-renewal-refused-past-ttl
            renew_interval: "100"
            renew_fail: "1"
            lease_ttl: "300"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wfw
          POSTGRES_PASSWORD: wfw
          POSTGRES_DB: wfw_conformance
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      WORKFLOW_WORLD_CONFORMANCE_URL: postgres://wfw:wfw@127.0.0.1:5432/wfw_conformance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run upstream's suite against runner=external
        run: npm run test:conformance
        env:
          # Empty means "unset": `positiveNumber` falls back on a non-positive
          # parse, and the stub compares STUB_RENEW_FAIL against "1".
          WORKFLOW_DISPATCHER_LEASE_RENEW_INTERVAL_MS: ${{ matrix.renew_interval }}
          WORKFLOW_DISPATCHER_ACTIVATION_LEASE_TTL_MS: ${{ matrix.lease_ttl }}
          STUB_RENEW_FAIL: ${{ matrix.renew_fail }}

  e2e:
    name: Real eve agent (${{ matrix.eve }})
    runs-on: ubuntu-latest
    strategy:
      # Which eve version broke is the diagnostic; do not cancel the others.
      fail-fast: false
      matrix:
        # Mirrors e2e-tests/eve-versions.mts. Keep the two in step — the file is
        # what the suite reads; this list is only what CI pays for.
        eve: ["0.29.5"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wfw
          POSTGRES_PASSWORD: wfw
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Points at `postgres` because the suite creates a database per eve version
      # and connects to that.
      WORKFLOW_WORLD_E2E_URL: postgres://wfw:wfw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build a real eve agent and drive one turn through this World
        run: npm run test:e2e

  pack:
    name: Tarball contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack
        run: npm pack --pack-destination /tmp/wfw
      - name: Install the tarball into a clean project and import it
        run: |
          mkdir -p /tmp/wfw-smoke && cd /tmp/wfw-smoke
          npm init -y >/dev/null
          npm install /tmp/wfw/*.tgz
          # The published resolution, not the workspace one.
          node --input-type=module -e '
            import { createWorld, runMigrations, ensureTenantPartitions } from "@evelandhq/workflow-world";
            import { main } from "@evelandhq/workflow-world/dispatcher";
            for (const [name, value] of Object.entries({ createWorld, runMigrations, ensureTenantPartitions, main })) {
              if (typeof value !== "function") throw new Error(`${name} is not exported`);
            }
            console.log("exports ok");
          '
          # Migrations ship as files, not just as code that references them.
          test -f node_modules/@evelandhq/workflow-world/migrations/0001_initial.sql
          # The licence obligations are part of the artifact, not of the repo.
          test -f node_modules/@evelandhq/workflow-world/LICENSE
          test -f node_modules/@evelandhq/workflow-world/NOTICE
          grep -q "Apache License" node_modules/@evelandhq/workflow-world/LICENSE
          grep -q "world-postgres" node_modules/@evelandhq/workflow-world/NOTICE
          echo "tarball contract ok"
